name: Build Live TV APK

on:
  push:
    branches: [main]
    paths: ["LiveTV/**", ".github/workflows/build-livetv.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LiveTV
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: LiveTV

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-debug-apk
          path: LiveTV/app/build/outputs/apk/debug/app-debug.apk
